spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/payments_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

kafka:
  bootstrap-servers: kafka:9092
  security:
    protocol: SASL_PLAINTEXT
  properties:
    sasl.mechanism: SCRAM-SHA-512
    sasl.jaas.config: >
      org.apache.kafka.common.security.scram.ScramLoginModule required
      username="${KAFKA_CLIENT_USERNAME}"
      password="${KAFKA_CLIENT_PASSWORD}";


payment:
  failure-rate: 0.3
  retry:
    max-attempts: 3
    delay-ms: 2000
  error-handler:
    back-off-interval-ms: 1000
    back-off-max-attempts: 3

outbox:
  retention-hours: 24
  cleanup-interval-ms: 3600000

connect:
  url: http://kafka-connect-1:8083
  connector-names:
    - debezium-orders-outbox

management:
  endpoint:
    health:
      show-details: always